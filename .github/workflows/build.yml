name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            bin: kuis-rust
          - os: windows-latest
            name: windows
            bin: kuis-rust.exe
          - os: macos-latest
            name: macos
            bin: kuis-rust
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: kuis-rust-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
      - name: Lampirkan ke Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.bin }}
